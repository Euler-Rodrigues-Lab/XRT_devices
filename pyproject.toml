[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xrt-devices"
version = "0.1.0"
description = "Public Python XRT and MediaPipe teleoperation input devices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*.txt"]
authors = [{name = "kczttm"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
xr = ["aiortc>=1.9,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "loguru>=0.7,<1"]
mediapipe = ["mediapipe>=0.10.20,<0.11", "opencv-contrib-python>=4.8,<5"]
recording = ["pandas>=2,<3"]
test = ["pytest>=8", "httpx>=0.27", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
